<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Launcher</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05060d" />
  <link rel="icon" href="/nova-launcher-web/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/nova-launcher-web/styles.css" />
</head>
<body>

  <!-- Logo de Nova, reutilizable con <use href="#logo"> -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset=".45" stop-color="#22d3ee" />
        <stop offset="1" stop-color="#8b5cf6" />
      </linearGradient>
    </defs>
    <symbol id="logo" viewBox="0 0 120 120">
      <g transform="rotate(-18 60 60)">
        <ellipse cx="60" cy="60" rx="54" ry="14" fill="none" stroke="url(#lg)" stroke-width="5" opacity=".85" />
      </g>
      <circle cx="60" cy="60" r="28" fill="#000" stroke="url(#lg)" stroke-width="2.6" />
      <path d="M30 52A33 33 0 0 1 90 52" fill="none" stroke="#fff" stroke-width="1.6" opacity=".7" />
      <g transform="rotate(-18 60 60)">
        <path d="M6 60A54 14 0 0 0 114 60" fill="none" stroke="url(#lg)" stroke-width="5.5" stroke-linecap="round" />
      </g>
      <path d="M98 12l2.4 6.6 6.6 2.4-6.6 2.4-2.4 6.6-2.4-6.6-6.6-2.4 6.6-2.4z" fill="#fff" />
    </symbol>
  </svg>

  <div class="bg-video" aria-hidden="true">
    <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="/nova-launcher-web/assets/nova-bg-poster.jpg">
      <source src="/nova-launcher-web/assets/nova-bg.mp4" type="video/mp4" />
    </video>
  </div>

  <header class="topbar" id="topbar">
    <a href="/nova-launcher-web/" class="brand" aria-label="Nova Launcher">
      <svg class="brand-logo" aria-hidden="true"><use href="#logo" /></svg>
      <span>NOVA <b>LAUNCHER</b></span>
    </a>

    <div class="controls">
      <button class="icon-btn" id="theme-toggle" type="button" data-i18n-aria="theme_toggle" aria-label="Cambiar tema">
        <span aria-hidden="true">☾</span>
      </button>
      <select class="lang-select" id="lang-select" aria-label="Idioma">
        <option value="es">ES</option>
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
      </select>
    </div>
  </header>

  <main class="error-page">
    <p class="error-code" aria-hidden="true">404</p>
    <h2 data-i18n="e404_title">Esta órbita está vacía</h2>
    <p data-i18n="e404_text">La página que buscas no existe o se ha movido.</p>
    <a class="btn btn-primary" href="/nova-launcher-web/" data-i18n="e404_btn">Volver al inicio</a>
  </main>

  <script src="/nova-launcher-web/main.js" defer></script>
</body>
</html>
